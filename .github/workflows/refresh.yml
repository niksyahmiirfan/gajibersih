name: Rate refresh watcher
# Daily: fetch official rate pages, diff against stored fingerprints, open an issue when one changes.
on:
  schedule:
    - cron: '43 23 * * *'   # 07:43 MYT
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - id: check
        run: npx tsx scripts/refresh-check.ts --out changes.md
      - name: Open issue for changed sources
        if: steps.check.outputs.changed == 'true'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh label create data-refresh --color D93F0B --description "Official rate source changed" --force
          gh issue create --title "Official rate page changed ($(date +%F))" --body-file changes.md --label data-refresh
      - name: Stage updated fingerprints
        run: |
          git add data/watch-state.json
          git diff --cached --quiet || echo "CHANGED=true" >> "$GITHUB_ENV"

      - name: Open pull request
        if: ${{ env.CHANGED == 'true' }}
        uses: peter-evans/create-pull-request@v7
        with:
          branch: bot-data
          title: 'chore: update watch fingerprints (${{ github.run_id }})'
          commit-message: 'chore: update watch fingerprints'
          body: Automated fingerprint update from the rate refresh watcher. Review and merge into main.
          labels: automated, needs-review
          add-paths: data/watch-state.json
